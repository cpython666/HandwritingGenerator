[package]
name = "xingjian"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "星笺 · 离线手写图片生成器"
license = "MIT"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]
screenshot = ["gui", "eframe/__screenshot"]

[dependencies]
anyhow = "1"
brotli-decompressor = "5"
clap = { version = "4", features = ["derive"] }
csscolorparser = "0.7"
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland"] }
fontdue = "0.9"
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = { version = "=0.15.4", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }
rustybuzz = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-linebreak = "0.1"
unicode-segmentation = "1"

[build-dependencies]
brotli = "8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3
